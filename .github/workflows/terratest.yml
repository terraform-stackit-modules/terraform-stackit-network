name: Terratest

on:
  workflow_dispatch:

env:
  TERRAFORM_VERSION: "1.12.0"
  GO_VERSION: "1.24"

jobs:
  terratest:
    name: Terratest
    runs-on: ubuntu-latest
    # Skip on forks as they won't have access to STACKIT secrets
    if: github.repository_owner == 'terraform-stackit-modules'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Terratest
        working-directory: test
        env:
          STACKIT_SERVICE_ACCOUNT_KEY: ${{ secrets.STACKIT_SERVICE_ACCOUNT_KEY }}
          STACKIT_PROJECT_ID: ${{ secrets.STACKIT_PROJECT_ID }}
        run: |
          go mod init github.com/terraform-stackit-modules/${{ github.event.repository.name }}
          go mod tidy
          go test -v -timeout 45m ./...
